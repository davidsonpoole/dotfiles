# keyd: Mac-style keybindings
# Cmd acts as Ctrl (Cmd+C/V/X/Z/A/S/T/W/N/F/R/L...), with Mac extras below.
[ids]
*

[main]
leftmeta = layer(meta_mac)
rightmeta = layer(meta_mac)
leftalt = layer(alt_mac)
rightalt = layer(alt_mac)
# Swap Caps Lock and Left Ctrl
capslock = leftcontrol
leftcontrol = capslock

# Everything not listed here = Ctrl+<key>
[meta_mac:C]
# Cmd+Tab / Cmd+` : switch apps / windows (hold Cmd to keep cycling)
tab = swapm(app_switch_state, A-tab)
` = A-grave
# Cmd+Q : quit app
q = A-f4
# Cmd+Space : KRunner (app launcher / search, like Spotlight)
space = A-space
# Cmd+Arrows : line / document start & end
left = home
right = end
up = C-home
down = C-end
# Cmd+Backspace : delete to start of line
backspace = macro(S-home delete)

[app_switch_state:A]

# Option behaves as Alt, plus Mac word navigation
[alt_mac:A]
left = C-left
right = C-right
backspace = C-backspace
delete = C-delete
