# Per-app keyd overrides (keyd-application-mapper)

# Konsole: make Cmd behave like it does in iTerm.
# Konsole's own shortcuts use Ctrl+Shift, so Cmd+<key> sends Ctrl+Shift+<key>.
# Plain Ctrl (your Caps Lock key) still goes to the shell (Ctrl+C = interrupt).
[*konsole*]
meta_mac.c = C-S-c
meta_mac.v = C-S-v
meta_mac.t = C-S-t
meta_mac.w = C-S-w
meta_mac.n = C-S-n
meta_mac.f = C-S-f
meta_mac.k = C-S-k
# Cmd+1..9 : go to tab N
meta_mac.1 = A-1
meta_mac.2 = A-2
meta_mac.3 = A-3
meta_mac.4 = A-4
meta_mac.5 = A-5
meta_mac.6 = A-6
meta_mac.7 = A-7
meta_mac.8 = A-8
meta_mac.9 = A-9
# Cmd+Backspace : delete to start of line (shell Ctrl+U)
meta_mac.backspace = C-u
# Option+Backspace / Option+Delete : delete word back / forward (shell Alt+Backspace / Alt+D)
alt_mac.backspace = A-backspace
alt_mac.delete = A-d
